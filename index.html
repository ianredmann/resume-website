    <!-- Sets html background before any paint so Safari's overscroll/status
         bar area is dark by default. colorScheme inline style overrides any
         CSS color-scheme rule regardless of specificity. -->
    <style>html { background-color: #2a2825; }</style>
    <script>
      (function () {
        // Follow the visitor's OS preference until they pick a theme with the toggle.
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        var dark = stored ? stored !== 'light' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        window.__initialDark = dark;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = dark ? '#2a2825' : '#f6f4ef';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#1e1c1a' : '#ede9e1');
      })();
    </script>
    <script type="module" crossorigin src="/resume-website/assets/index-DMJIavWd.js"></script>

  <body>
    <!-- Runs synchronously before React's first render so CSS vars resolve
         correctly and the glass navbar backdrop shows the right color. -->
    <script>
      if (window.__initialDark) {
        document.body.classList.add('dark-mode');
      }
    </script>
